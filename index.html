<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Upload</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 520px; margin: 40px auto; padding: 0 16px; }
  input, button { display: block; width: 100%; margin: 10px 0; padding: 10px; box-sizing: border-box; }
  #log { white-space: pre-wrap; margin-top: 16px; }
</style>
</head>
<body>
  <h2>Upload a file</h2>
  <input id="file" type="file" multiple>
  <button id="go">Upload</button>
  <div id="log"></div>

<script>
// paste your deployed worker url here
const WORKER_URL = "https://gh-pages-uploader.YOUR_SUBDOMAIN.workers.dev";
const MAX_BYTES = 20 * 1024 * 1024;

const log = (m) => { document.getElementById("log").textContent += m + "\n"; };

const toBase64 = (file) => new Promise((res, rej) => {
  const r = new FileReader();
  r.onload = () => res(r.result.split(",")[1]);
  r.onerror = () => rej(new Error("read failed"));
  r.readAsDataURL(file);
});

document.getElementById("go").onclick = async () => {
  const files = document.getElementById("file").files;
  if (!files.length) { log("pick a file first"); return; }
  for (const f of files) {
    if (f.size > MAX_BYTES) { log("SKIPPED " + f.name + " over 20 MB"); continue; }
    try {
      const res = await fetch(WORKER_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name: f.name, content: await toBase64(f) })
      });
      const data = await res.json().catch(() => ({}));
      if (res.status === 201) log("UPLOADED " + f.name + " (live in about a minute at uploads/" + encodeURIComponent(f.name) + ")");
      else if (res.status === 409) log("SKIPPED " + f.name + " already exists");
      else log("FAILED " + f.name + " " + (data.message || res.status));
    } catch (e) {
      log("ERROR " + f.name + " " + e.message);
    }
  }
};
</script>
</body>
</html>
