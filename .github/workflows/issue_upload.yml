name: upload from issue
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
  actions: write
concurrency:
  group: upload
  cancel-in-progress: false
jobs:
  save:
    if: startsWith(github.event.issue.title, 'upload:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: save attachments (create only, never overwrite)
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - << 'PY'
          import os, re, urllib.parse, urllib.request

          body = os.environ.get("ISSUE_BODY") or ""
          NAME_RE = re.compile(r"^[A-Za-z0-9][A-Za-z0-9._ -]{0,99}$")
          MAX = 25 * 1024 * 1024
          EXT = {"image/png": ".png", "image/jpeg": ".jpg", "image/gif": ".gif",
                 "image/webp": ".webp", "video/mp4": ".mp4", "video/quicktime": ".mov"}
          URL_OK = re.compile(r"^https://github\.com/user-attachments/(files/\d+/[^/\s)]+|assets/[0-9a-fA-F-]+)$")

          found = []
          for alt, url in re.findall(r"!?\[([^\]]*)\]\((https://github\.com/user-attachments/[^)\s]+)\)", body):
              found.append((alt, url))
          for url in re.findall(r'src="(https://github\.com/user-attachments/[^"\s]+)"', body):
              found.append(("", url))

          os.makedirs("uploads", exist_ok=True)
          lines, saved, seen = [], 0, set()

          def clean(name):
              name = re.sub(r"[^A-Za-z0-9._ -]", "_", name).strip()
              name = re.sub(r"^[^A-Za-z0-9]+", "", name)
              return name[:100]

          for alt, url in found[:10]:
              if url in seen:
                  continue
              seen.add(url)
              if not URL_OK.match(url):
                  lines.append("SKIPPED a link that is not a github attachment")
                  continue
              is_file = "/files/" in url
              raw = urllib.parse.unquote(url.rsplit("/", 1)[1]) if is_file else (alt.strip() or "image")
              name = clean(raw)
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent": "uploader"}), timeout=60) as r:
                      ctype = (r.headers.get("Content-Type") or "").split(";")[0].strip()
                      data = r.read(MAX + 1)
              except Exception as e:
                  lines.append("FAILED " + (name or "file") + " download error")
                  continue
              if len(data) > MAX:
                  lines.append("SKIPPED " + (name or "file") + " is over 25 MB")
                  continue
              if not is_file and "." not in name and ctype in EXT:
                  name += EXT[ctype]
              if not NAME_RE.match(name) or ".." in name:
                  lines.append("SKIPPED a file with a bad name")
                  continue
              dest = os.path.join("uploads", name)
              if os.path.exists(dest):
                  lines.append("SKIPPED " + name + " already exists")
                  continue
              with open(dest, "xb") as f:
                  f.write(data)
              saved += 1
              lines.append("UPLOADED " + name + " (live in about a minute)")

          if not found:
              lines.append("no attachment found in this issue, drag the file into the box")

          open("/tmp/result.md", "w").write("\n\n".join(lines) + "\n")
          open("/tmp/saved", "w").write(str(saved))
          PY
          if [ "$(cat /tmp/saved)" -gt 0 ]; then
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add uploads
            git commit -m "upload from issue #$ISSUE_NUMBER"
            git pull --rebase origin main
            git push origin HEAD:main
            gh workflow run pages.yml --ref main
          fi
          gh issue comment "$ISSUE_NUMBER" --body-file /tmp/result.md
          gh issue close "$ISSUE_NUMBER" --reason completed
