name: Upload a file
description: Drag a file into the box and submit. A workflow saves it to uploads.
title: "upload: "
body:
  - type: markdown
    attributes:
      value: |
        Drag your file or files into the box below, then submit.
        Files that already exist are skipped. Max 25 MB each.
        Do not change the title.
  - type: textarea
    id: files
    attributes:
      label: Files
      description: Drag and drop here
    validations:
      required: true
